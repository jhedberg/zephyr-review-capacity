name: Update and publish

on:
  schedule:
    - cron: '41 3 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full:
        description: Keep fetching across API resets until the cache is complete (up to 5 hours)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

env:
  SOURCE_REPO: zephyrproject-rtos/zephyr
  SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip3 install -U pyyaml

      # The pull request cache travels with the site: each run starts from the
      # one the previous run published.
      - name: Restore the cache from the published site
        run: |
          mkdir -p cache
          code=$(curl -sL -o cache/prs.json.gz -w '%{http_code}' "$SITE/cache/prs.json.gz")
          if [ "$code" != 200 ]; then
            rm -f cache/prs.json.gz
            root=$(curl -sL -o /dev/null -w '%{http_code}' "$SITE/")
            if [ "$root" = 200 ]; then
              echo "The site is up but its cache did not download ($code): not starting over."
              exit 1
            fi
            echo "No published cache yet: starting an empty one."
          fi

      - name: Fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python -u fetch.py --repo "$SOURCE_REPO" --cache cache/prs.json.gz --max-minutes 300 --wait-for-reset
          else
            python -u fetch.py --repo "$SOURCE_REPO" --cache cache/prs.json.gz --max-minutes 25
          fi

      - name: Build
        run: |
          curl -sfL "https://raw.githubusercontent.com/$SOURCE_REPO/main/MAINTAINERS.yml" -o MAINTAINERS.yml
          python -u build.py --repo "$SOURCE_REPO" --cache cache/prs.json.gz --maintainers MAINTAINERS.yml --out public/data
          mkdir -p public/cache
          cp cache/prs.json.gz public/cache/

      - name: Setup pages
        uses: actions/configure-pages@v6

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
